name: fishing_voyage_manag_sys
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  printing: ^5.11.0
  pdf: ^3.10.7
  intl: ^0.18.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  http: ^1.1.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  flutter_map_tile_caching: ^10.1.1
  flutter_foreground_task: ^8.17.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  flutter_local_notifications: ^17.0.0
  fl_chart: ^0.70.0
  image_picker: ^1.1.2
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.0
  android_intent_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1     # ⭐ ADDED

flutter:
  uses-material-design: true

  assets:                              # ⭐ ADDED
    - assets/

# ⭐ ADDED — App launcher icon config
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1257C7"
  adaptive_icon_foreground: "assets/logo2.png"
  remove_alpha_ios: true